services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      reco:
        condition: service_healthy
      crawler:
        condition: service_healthy
      tracking:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
  reco:
    build: ./python
    ports:
      - "8000:8000"
    env_file:
      - ./python/.env
    environment:
      - ARTIFACT_DIR=/app/reco_artifacts
    command: ["uvicorn", "reco:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  crawler:
    build: ./python
    ports:
      - "8001:8001"
    env_file:
      - ./python/.env
    volumes:
      - ./python/data:/app/data
    command: ["uvicorn", "crawler:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tracking:
    build: ./python
    ports:
      - "8002:8002"
    env_file:
      - ./python/.env
    environment:
      - DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./python/data:/app/data
      - ./python/issue_outputs:/app/issue_outputs
    command: ["uvicorn", "tracking_summary_parity_clean:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
