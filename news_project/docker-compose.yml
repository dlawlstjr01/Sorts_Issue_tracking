services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - reco
      - crawler
      - tracking
      - counter_python

  reco:
    build: ./python
    ports:
      - "8000:8000"
    env_file:
      - ./python/.env
    environment:
      - ARTIFACT_DIR=/app/reco_artifacts
    command: ["uvicorn", "reco:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped


  crawler:
    build: ./python
    ports:
      - "8001:8001"
    env_file:
      - ./python/.env
    volumes:
      - ./python/data:/app/data
    command: ["uvicorn", "crawler:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped


  tracking:
    build: ./python
    ports:
      - "8002:8002"
    env_file:
      - ./python/.env
    volumes:
      - ./python/data:/app/data
      - ./python/issue_outputs:/app/issue_outputs
    command: ["uvicorn", "tracking_summary_parity_clean:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: unless-stopped


  counter_python:
    build: ./python
    ports:
      - "8003:8003"
    env_file:
      - ./python/.env
    environment:
      - ARTIFACT_DIR=/app/reco_artifacts
    command: ["uvicorn", "counter_reco_app:app", "--host", "0.0.0.0", "--port", "8003"]
    restart: unless-stopped